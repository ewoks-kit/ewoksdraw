[package]
name = "elk-rs-python"
version = "0.0.0"
edition = "2021"
authors = ["ESRF <dau-pydev@esrf.fr>"]
description = "Python bindings to the elk-rs graph layout engine"
license = "MIT"
publish = false

[lib]
name = "_elk_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }

[dependencies.org-eclipse-elk-graph-json]
git = "https://github.com/openedges/elk-rs.git"
rev = "2191680292b9565592223c22a28b5ef33c3acbad"
package = "org-eclipse-elk-graph-json"
