[build-system]
requires = ["setuptools>=46.4"]
build-backend = "setuptools.build_meta"

[project]
name = "ewoksdraw"
version = "0.0.1"
authors = [{ name = "ESRF", email = "dau-pydev@esrf.fr" }]
description = "Render Ewoks workflows as SVG"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE.md" }
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "ewokscore>=5.1.0rc2,<6",
    "xmltodict",
    "pyelk @ git+https://github.com/LudoBroche/pyelk.git@ewoksdraw-modifications",
]

[project.urls]
Homepage = "https://github.com/ewoks-kit/ewoksdraw/"
Documentation = "https://ewoksdraw.readthedocs.io/"
Repository = "https://github.com/ewoks-kit/ewoksdraw/"
Issues = "https://github.com/ewoks-kit/ewoksdraw/issues/"
Changelog = "https://github.com/ewoks-kit/ewoksdraw/-/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest >=7",
]
dev = [
    "pytest >=7",
    "ruff",
    "mypy",
]
doc = [
    "sphinx >=4.5",
    "sphinx-autodoc-typehints >=1.16",
    "pydata-sphinx-theme",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
ewoksdraw = ["**/*.css", "**/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
omit = ["*/tests/*"]

[tool.pytest.ini_options]
testpaths = ["src/ewoksdraw/tests"]

[tool.ruff]
src = ["."]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "setuptools.*"
ignore_missing_imports = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.pypi-dependencies]
ewoksdraw = { path = ".", editable = true }
ewokscore = { path = "../ewokscore", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
doc = { features = ["doc"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
